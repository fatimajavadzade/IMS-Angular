<div class="flex min-h-screen items-center justify-center bg-ink-900 px-4 dark:bg-ink-950">
  <div
    class="w-full max-w-md rounded-xl2 bg-white p-8 shadow-xl dark:bg-ink-900 dark:ring-1 dark:ring-white/10"
  >
    <div class="mb-8 flex items-center gap-2 text-brand-700 dark:text-brand-400">
      <lucide-angular [img]="Boxes" [size]="28" />
      <span class="font-display text-xl font-semibold">IMS</span>
    </div>

    <h1 class="mb-1 text-2xl font-semibold text-ink-900 dark:text-ink-100">Hesaba giriş</h1>

    <p class="mb-6 text-sm text-ink-500 dark:text-ink-400">
      Davam etmək üçün məlumatlarınızı daxil edin.
    </p>

    @if (serverError()) {
      <div
        class="mb-4 rounded-lg border border-bad-700/30 bg-bad-100 px-3 py-2 text-sm text-bad-700 dark:border-bad-500/30 dark:bg-bad-500/10 dark:text-bad-400"
      >
        {{ serverError() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <label class="mb-4 block">
        <span class="mb-1.5 block text-sm font-medium text-ink-700 dark:text-ink-300">
          E-poçt
        </span>
        <div
          class="flex items-center gap-2 rounded-lg border border-ink-100 bg-ink-100/40 px-3 focus-within:border-brand-500 dark:border-white/10 dark:bg-white/5"
        >
          <lucide-angular [img]="Mail" [size]="16" class="text-ink-300 dark:text-ink-500" />
          <!-- <app-input
            type="email"
            placeholder="ad@sirket.com"
            className="border-0 bg-transparent px-0"
            [(value)]="email"
            [error]="!!fieldErrors()['email']"
          /> -->
          <input
            type="text"
            placeholder="Enter email"
            class="outline-none p-2 w-100"
            formControlName="email"
          />
        </div>
        @if (loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched) {
          <small class="mt-1 text-xs text-bad-700 dark:text-bad-400">Email is required</small>
        }

        @if (loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched) {
          <small class="mt-1 text-xs text-bad-700 dark:text-bad-400">Enter a valid email</small>
        }

        @if (fieldErrors()['email']) {
          <p class="mt-1 text-xs text-bad-700 dark:text-bad-400">{{ fieldErrors()['email'] }}</p>
        }
      </label>

      <label class="mb-6 block">
        <span class="mb-1.5 block text-sm font-medium text-ink-700 dark:text-ink-300"> Şifrə </span>
        <div
          class="flex items-center gap-2 rounded-lg border border-ink-100 bg-ink-100/40 px-3 focus-within:border-brand-500 dark:border-white/10 dark:bg-white/5"
        >
          <lucide-angular [img]="Lock" [size]="16" class="text-ink-300 dark:text-ink-500" />
          <!-- <app-input
            type="password"
            placeholder="••••••••"
            className="border-0 bg-transparent px-0"
            [(value)]="password"
            [error]="!!fieldErrors()['password']"
            formControlName="password"
          /> -->
          <input
            type="password"
            placeholder="Enter a password"
            class="outline-none p-2 w-100"
            formControlName="password"
          />
        </div>
        @if (
          loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched
        ) {
          <small class="mt-1 text-xs text-bad-700 dark:text-bad-400">Password is required</small>
        }

        @if (
          loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched
        ) {
          <small class="mt-1 text-xs text-bad-700 dark:text-bad-400"
            >Password must be at least 6 characters</small
          >
        }

        @if (fieldErrors()['password']) {
          <p class="mt-1 text-xs text-bad-700 dark:text-bad-400">{{ fieldErrors()['password'] }}</p>
        }
      </label>

      <button
        type="button"
        (click)="submit()"
        [disabled]="submitting()"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-brand-600 dark:hover:bg-brand-500"
      >
        {{ submitting() ? 'Yoxlanılır…' : 'Daxil ol' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-ink-500 dark:text-ink-400">
      Hesabınız yoxdur?
      <a
        routerLink="/register"
        class="font-medium text-brand-700 hover:underline dark:text-brand-400"
      >
        Qeydiyyatdan keçin
      </a>
    </p>
  </div>
</div>
