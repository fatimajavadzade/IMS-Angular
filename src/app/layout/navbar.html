<header
  class="flex h-16 shrink-0 items-center justify-end gap-4 border-b border-ink-100 bg-white px-6 dark:border-white/10 dark:bg-ink-900"
>
  <div class="flex items-center gap-4">
    <button
      type="button"
      (click)="theme.toggle()"
      class="rounded-lg p-2 text-ink-500 transition hover:bg-ink-100/60 hover:text-ink-900 dark:text-ink-400 dark:hover:bg-white/5 dark:hover:text-ink-100"
    >
      <lucide-angular [img]="theme.theme() === 'dark' ? Sun : Moon" [size]="18" />
    </button>

    <div class="flex items-center gap-2 border-l border-ink-100 pl-4 dark:border-white/10">
      <div
        class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-800 dark:bg-brand-500/20 dark:text-brand-300"
      >
        {{ (user()?.email ?? '?').charAt(0).toUpperCase() }}
      </div>

      <div class="leading-tight">
        <p class="text-sm font-semibold text-ink-900 dark:text-ink-100">
          {{ user()?.email }}
        </p>
        <p class="text-xs text-ink-500 dark:text-ink-400">{{ user()?.role }}</p>
      </div>

      <a
        routerLink="/login"
        (click)="auth.logout()"
        aria-label="Çıxış"
        title="Çıxış"
        class="ml-1 rounded-lg p-2 text-ink-500 transition hover:bg-ink-100/60 hover:text-bad-700 dark:text-ink-400 dark:hover:bg-white/5 dark:hover:text-bad-400"
      >
        <lucide-angular [img]="LogOut" [size]="16" />
      </a>
    </div>
  </div>
</header>
